<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6CB000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>收件小幫手</title>
<style>
:root{
  --g:#6CB000; --g-d:#4E8A00; --g-t:#5CA000; --ink:#1B1F1D; --ink2:#5A635E; --line:#DADFD8;
  --paper:#F5F6F3; --done:#2E9E44; --target:#FF8A00; --danger:#B3261E; --info:#1A73E8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0;display:flex;align-items:center;flex:none}
header h1{flex:1;text-align:center;font-size:19px;font-weight:600;margin:0;letter-spacing:.06em}
header .ib{width:48px;height:48px;border:0;background:none;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
header .ib.hid{visibility:hidden}
.strip{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;flex:none}
.pill{padding:3px 8px;border-radius:10px;background:#F0F2EE;border:0;font-size:13px;white-space:nowrap}
.net.on{color:var(--done)} .net.off{color:var(--danger)}
.q{margin-left:auto} .q.has{background:#FFF1DC;color:#9A5B00;font-weight:600}
.body{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.foot{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;display:flex;gap:8px;flex:none;border-top:1px solid var(--line)}
.foot:empty{display:none}
.btn{flex:1;height:50px;border:0;border-radius:4px;background:var(--g);color:#fff;font-size:17px;font-weight:600;letter-spacing:.04em}
.btn.sec{background:#fff;color:var(--g-d);border:1.5px solid var(--g)}
.btn.warn{background:#fff;color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{height:42px;font-size:15px}
.btn:disabled{opacity:.4}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.menu button{border:0;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:18px 16px;text-align:left;display:flex;gap:14px;align-items:center}
.menu .ic{width:48px;height:48px;border-radius:12px;background:var(--g);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.menu b{font-size:18px;display:block} .menu small{color:var(--ink2);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=search],input[type=url]{width:100%;height:46px;border:1px solid var(--line);border-radius:4px;padding:0 12px;font-size:17px;background:#fff;color:var(--ink)}
.inrow{display:flex;gap:8px} .inrow input{flex:1;min-width:0} .inrow .btn{flex:none;width:96px;height:46px;font-size:15px}
.note{font-size:13.5px;padding:8px 10px;border-radius:6px;margin:8px 0;line-height:1.55}
.note.y{background:#FFF4E0;color:#8A5A12} .note.r{background:#FCE4E2;color:var(--danger)} .note.g{background:#E8F4E0;color:#3B6B00} .note.b{background:#E7F0FD;color:#1756A9}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;background:#fff;padding:11px;border-radius:6px;border:1px solid var(--line)}
.chk input{width:24px;height:24px;accent-color:var(--g);flex:none}
.list .it{background:#fff;border-radius:8px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px}
.list .it .t{flex:1;min-width:0} .list .it b{font-size:16px}
.list .it small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;padding:2px 8px;border-radius:9px;white-space:nowrap;flex:none}
.st.draft{background:#F0F2EE;color:var(--ink2)} .st.queue{background:#FFF1DC;color:#9A5B00} .st.up{background:#E7F0FD;color:var(--info)}
.st.done{background:#E3F3E6;color:var(--done)} .st.nas{background:var(--done);color:#fff} .st.err,.st.busy{background:#FCE4E2;color:var(--danger)} .st.exp{background:#EDE7F6;color:#5E35B1}
.who{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:10px;border-left:4px solid var(--g)}
.who b{font-size:18px} .who small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.doc{background:#fff;border-radius:8px;margin-bottom:9px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.doc .hd{display:flex;align-items:center;gap:8px}
.doc .hd b{flex:1;font-size:16px}
.cnt{font-size:13px} .cnt.need{color:var(--danger)} .cnt.fine{color:var(--done)} .cnt.opt{color:var(--ink2)}
.shot{border:0;background:var(--g);color:#fff !important;border-radius:4px;padding:8px 12px;font-size:14px}
.shot.alt{background:#fff;color:var(--g-d) !important;border:1.5px solid var(--g);padding:6.5px 10px}
.shot:disabled{opacity:.4}
.hint{font-size:12.5px;color:var(--ink2);margin-top:3px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative;width:66px;height:66px;border-radius:5px;background:#ddd center/cover no-repeat;border:2px solid transparent}
.thumbs div.bad{border-color:var(--danger)}
.thumbs div span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;text-align:center}
.thumbs div i{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;font-style:normal;font-size:14px;line-height:22px;text-align:center}
.bar{height:8px;border-radius:4px;background:#E3E6E0;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--g)}
.pdfs a,.pdfs button{display:flex;width:100%;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:6px;color:var(--ink);text-decoration:none;font-size:14px;text-align:left}
.pdfs span{margin-left:auto;color:var(--ink2);font-size:12px}
.sec-t{font-size:14px;color:var(--ink2);margin:16px 0 6px}
.radio{display:block;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.radio.on{border-color:var(--g);background:#F4FAEC}
.radio b{font-size:15px} .radio small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
/* 覆蓋層 */
.ov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.cam .top{color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;font-size:15px}
.cam .top b{flex:1}
.cam .vf{flex:1;position:relative;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 3000px rgba(0,0,0,.42);pointer-events:none}
.cam .aim:after{content:attr(data-t);position:absolute;left:-40px;right:-40px;top:-34px;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
.cam .tip{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font-size:13px;text-align:center;text-shadow:0 1px 3px #000}
.cam .bot{height:calc(118px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;padding-left:22px;padding-right:22px}
.cam .last{width:58px;height:58px;border-radius:6px;background:#333 center/cover;border:2px solid transparent}
.cam .last.bad{border-color:#FF6B5E}
.cam .shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
.cam .shutter:active{transform:scale(.94)} .cam .shutter:disabled{opacity:.4}
.cam .fin{border:0;background:none;color:#fff;font-size:17px;width:58px}
.cam .torch{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:16px;padding:4px 10px;font-size:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.viewer img{flex:1;object-fit:contain;min-height:0;width:100%}
.viewer .info{color:#fff;font-size:13px;padding:6px 12px}
.viewer .bt,.sign .bt{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.sign{background:#fff}
.sign .txt{padding:calc(12px + env(safe-area-inset-top)) 14px 6px;font-size:14px;line-height:1.6;max-height:34vh;overflow:auto}
.sign canvas{flex:1;margin:0 10px;border:2px dashed #bbb;border-radius:8px;touch-action:none;background:#fff;min-height:0}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(27,31,29,.92);color:#fff;padding:10px 15px;border-radius:18px;font-size:14.5px;z-index:90;max-width:88%;text-align:center;transition:opacity .3s}
</style>
</head>
<body>
<div id="app">
  <header><button class="ib" id="bBack" onclick="history.back()">‹</button><h1 id="ttl">收件小幫手</h1><button class="ib" id="bSet" onclick="go('settings')">⚙</button></header>
  <div class="strip">
    <span class="pill" id="sStaff"></span>
    <span class="pill net" id="sNet"></span>
    <span class="pill q" id="sQ"></span>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="packPick" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============ 常數 ============ */
const VER='0.1.0';
const WM='僅供成大智研公司驗證使用';
const DOCS=[
 {k:'id',n:'身分證',file:'身分證.pdf',min:2,max:2,aim:'card',hint:'先拍正面、再拍反面，兩面放在同一頁'},
 {k:'book',n:'存摺封面',file:'存摺.pdf',min:1,max:1,aim:'book',hint:'單張；上方帳號數字要清楚'},
 {k:'land',n:'地政土地謄本',file:'地籍謄本.pdf',min:1,max:60,aim:'page',hint:'可連續拍多筆'},
 {k:'lease',n:'承租合約',file:'租約.pdf',min:0,max:60,aim:'page',hint:'土地非本人時必收；可多張'},
 {k:'other',n:'其他',file:'其他.pdf',min:0,max:60,aim:'page',hint:'臨時補充文件；可多張'},
];
const AIM={card:[85.6,54],book:[100,70],page:[210,297]};
const Q_SHARP=80, Q_DARK=70;   // ⚠ 尚未以實機校準，只提醒不阻擋
const MAXQ=6;                  // 相機背景處理最多排隊張數

/* ============ IndexedDB ============ */
let DB;
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('intake',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('recs',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('pdfs',{keyPath:'id'});};
  r.onsuccess=()=>{DB=r.result;ok()};r.onerror=()=>no(r.error);});}
function tx(st,mode,fn){return new Promise((ok,no)=>{const t=DB.transaction(st,mode);let res;const s=t.objectStore(st);const q=fn(s);if(q)q.onsuccess=()=>res=q.result;t.oncomplete=()=>ok(res);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}
const dbGet=(st,k)=>tx(st,'readonly',s=>s.get(k));
const dbAll=st=>tx(st,'readonly',s=>s.getAll());
const dbPut=(st,v,k)=>tx(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k));
const dbDel=(st,k)=>tx(st,'readwrite',s=>s.delete(k));

/* ============ 狀態 ============ */
const S={screen:'home',stack:[],set:{ep:'',code:'',staff:'',mode:1},pack:null,recs:[],cur:null,view:null,online:navigator.onLine,urls:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hhmm=t=>new Date(t).toTimeString().slice(0,5);
function toast(t,ms=2400){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},ms);}
function newBatch(){const a=new Uint8Array(4);crypto.getRandomValues(a);return (Date.now().toString(36)+[...a].map(x=>x.toString(36).padStart(2,'0')).join('')).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);}
async function saveSet(){await dbPut('kv',S.set,'set')}
async function saveRec(r){await dbPut('recs',r)}
function photoURL(id,blob){if(!S.urls[id]&&blob)S.urls[id]=URL.createObjectURL(blob);return S.urls[id]}

/* ============ 導覽（返回鍵） ============ */
const TITLES={home:'收件小幫手',new:'建立收件資料',exist:'既有客戶補件',docs:'拍照收件',list:'查看已收件',rec:'收件內容',settings:'設定'};
function go(sc){ if(S.screen===sc)return; S.stack.push(S.screen); S.screen=sc; history.pushState({n:S.stack.length},''); render(); $('body').scrollTop=0; }
let overlayClose=null;
window.addEventListener('popstate',()=>{
  if(overlayClose){const f=overlayClose;overlayClose=null;f(true);return;}
  if(!S.stack.length){return;}
  S.screen=S.stack.pop(); if(S.screen==='home')S.cur=null; render();
});
function openOverlay(el,close){document.body.appendChild(el);history.pushState({ov:1},'');overlayClose=(fromPop)=>{el.remove();close&&close();};}
function closeOverlay(){if(overlayClose)history.back();}

/* ============ 狀態列 ============ */
const PENDING=['draft','queue','up','err'];
function renderStrip(){
  $('sStaff').textContent='👤 '+(S.set.staff||'未設定同仁');
  const n=$('sNet');n.className='pill net '+(S.online?'on':'off');n.textContent=S.online?'● 在線':'● 離線';
  const p=S.recs.filter(r=>['queue','up','err'].includes(r.status)).length, d=S.recs.filter(r=>r.status==='draft').length;
  const q=$('sQ');q.className='pill q'+(p||d?' has':'');
  q.textContent=p?`⬆ 未上傳 ${p} 戶`:(d?`✎ 未完成 ${d} 戶`:'✓ 無待上傳');
}
addEventListener('online',()=>{S.online=true;renderStrip();pump()});
addEventListener('offline',()=>{S.online=false;renderStrip()});

/* ============ 畫面 ============ */
function render(){
  const sc=S.screen;$('ttl').textContent=TITLES[sc]||'';
  $('bBack').classList.toggle('hid',sc==='home');$('bSet').classList.toggle('hid',sc==='settings');
  renderStrip();const B=$('body'),F=$('foot');F.innerHTML='';
  ({home:vHome,new:vNew,exist:vExist,docs:vDocs,list:vList,rec:vRec,settings:vSettings}[sc])(B,F);
}
function vHome(B){
  const pk=S.pack, old=S.recs.filter(r=>['queue','err'].includes(r.status)&&Date.now()-r.finished>3*864e5).length;
  B.innerHTML=`
  ${!S.set.staff?`<div class="note r">請先到 ⚙ 設定填寫同仁姓名。</div>`:''}
  ${!S.set.ep?`<div class="note y">尚未設定上傳位址：請用承辦提供的「設定連結」開啟一次。未設定也可以拍，資料會留在手機。</div>`:''}
  ${old?`<div class="note r">有 ${old} 戶超過 3 天未上傳，請盡快上傳或匯出。</div>`:''}
  <div class="menu">
    <button onclick="startNew()"><div class="ic">＋</div><div><b>建立收件資料</b><small>全新客戶，需要新的經營體編號</small></div></button>
    <button onclick="go('exist')"><div class="ic">↻</div><div><b>既有客戶補件</b><small>帶出編號、名稱、土地，不重複建檔</small></div></button>
    <button onclick="go('list')"><div class="ic">☰</div><div><b>查看已收件</b><small>確認上傳狀態、檢視與調整</small></div></button>
  </div>
  <div class="note ${pk?'b':'y'}" style="margin-top:16px">${pk?`收件包：${esc(pk.event)}・${pk.customers.length} 戶・${esc(pk.created.slice(0,16).replace('T',' '))}${pk.landIsSample?'<br>⚠ 土地資料為範例，行前會換成確認版':''}`:'尚未載入收件包（既有客戶補件需要）。到 ⚙ 設定下載或匯入。'}</div>
  <div style="text-align:center;color:#aaa;font-size:12px;margin-top:18px">v${VER}</div>`;
}
function vNew(B,F){
  const c=S.cur;
  B.innerHTML=`<div class="field"><label>經營體編號</label>
    <div class="inrow"><input type="text" value="${esc(c.no)}" placeholder="尚未取號" readonly><button class="btn" id="bNo" onclick="takeNo()" ${c.no?'disabled':''}>取號</button></div>
    ${c.no?(c.temp?`<div class="note y">暫編號（${S.online&&S.set.ep?'取號失敗':'離線'}）。上傳時自動換成正式編號。</div>`:`<div class="note g">正式編號（共用計數加鎖取號，不會重複）。</div>`)
      :`<div class="note b">不預先填號。按「取號」：有網路取正式號；沒網路給暫編號。</div>`}</div>
  <div class="field"><label>客戶姓名（人工輸入）</label><input type="text" id="iName" value="${esc(c.name)}" placeholder="例：林○○" autocomplete="off"></div>
  <div id="same"></div>
  <label class="chk"><input type="checkbox" id="iOwner" ${c.notOwner?'checked':''}>土地非本人所有（需收承租合約）</label>`;
  const nm=$('iName');nm.oninput=()=>{c.name=nm.value.trim();sameName();};$('iOwner').onchange=e=>{c.notOwner=e.target.checked};sameName();
  F.innerHTML=`<button class="btn" onclick="toDocs()">下一步：拍照</button>`;
}
function sameName(){
  const c=S.cur,el=$('same');if(!el)return;
  const hit=c.name&&S.pack?S.pack.customers.filter(x=>x.name===c.name):[];
  el.innerHTML=hit.length?`<div class="note r">收件包裡已有同名客戶：${hit.map(h=>`編號 ${esc(h.no)}（${esc(h.status||'—')}）`).join('、')}。若是同一人，請改用「既有客戶補件」，避免重複建檔。</div>`:'';
}
function vExist(B){
  if(!S.pack){B.innerHTML=`<div class="note y">尚未載入收件包。請到 ⚙ 設定下載或匯入。</div>`;return;}
  B.innerHTML=`<div class="field"><input type="search" id="iQ" placeholder="搜尋姓名、編號或地號" autocomplete="off"></div><div class="list" id="hits"></div>`;
  $('iQ').oninput=hits;hits();
}
function hits(){
  const q=($('iQ').value||'').trim();const all=S.pack.customers;
  const hs=q?all.filter(h=>h.name.includes(q)||h.no===q||h.no.startsWith(q)||h.lands.some(l=>l.includes(q))):[];
  const got=new Set(S.recs.filter(r=>r.status!=='draft').map(r=>r.no));
  $('hits').innerHTML=!q?`<div class="note b">共 ${all.length} 戶。輸入姓名（可只打一個字）、編號或地號搜尋。</div>`:
    hs.slice(0,60).map(h=>`<div class="it" onclick="pickExist('${esc(h.no)}')"><div class="t"><b>${esc(h.name)}</b> <span style="font-size:13px;color:var(--ink2)">${esc(h.no)}</span>
    <small>${esc(h.status||'')}${h.lands.length?`・土地 ${h.lands.length} 筆：${esc(h.lands.slice(0,2).join('、'))}`:'・無土地資料'}</small></div>${got.has(h.no)?'<span class="st done">本機已收</span>':''}</div>`).join('')
    +(hs.length>60?`<div class="note b">還有 ${hs.length-60} 筆，請輸入更多字。</div>`:'')+(hs.length?'':'<div class="note y">找不到。新客戶請回首頁選「建立收件資料」。</div>');
}
function vDocs(B,F){
  const c=S.cur,comp=completeness(c);
  B.innerHTML=`<div class="who"><b>${esc(c.name)}</b> <span class="st ${c.temp?'queue':'done'}">${esc(c.no)}${c.temp?'（暫）':''}</span>

const reqOf=(c,d)=>c.kind==='sup'?false:(d.k==='lease'?c.notOwner:d.min>0);

function completeness(c){
  const req=DOCS.filter(d=>reqOf(c,d)),missing=[];
  if(c.kind!=='sup'&&!c.consent.ok)missing.push('個資同意書');
  req.forEach(d=>{if(c.docs[d.k].length<needOf(c,d))missing.push(d.k==='id'&&c.docs.id.length===1?'身分證反面':d.n)});

/* ============ 影像處理 ============ */
function watermark(c){
  const x=c.getContext('2d'),fs=Math.round(Math.max(c.width,c.height)/24);
  x.save();x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/7);
  x.font=`bold ${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;x.fillStyle='rgba(200,40,40,.25)';x.textAlign='center';x.textBaseline='middle';
  const tw=x.measureText(WM).width+fs*2,D=Math.hypot(c.width,c.height),gap=fs*3.4;
  for(let y=-D/2,row=0;y<D/2;y+=gap,row++)for(let xx=-D/2+(row%2?tw/2:0);xx<D/2;xx+=tw)x.fillText(WM,xx,y);
  x.restore();
}
function quality(c){
  const w=320,h=Math.max(1,Math.round(c.height*w/c.width)),t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(c,0,0,w,h);const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let sum=0;
  for(let i=0;i<w*h;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];sum+=g[i]}
  let m=0,m2=0,n=0;for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const i=y*w+xx,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];m+=l;m2+=l*l;n++}
  const sharp=Math.round(m2/n-(m/n)**2),bright=Math.round(sum/(w*h));return {sharp,bright,ok:sharp>=Q_SHARP&&bright>=Q_DARK};
}
/** src: video/img/canvas；crop: {x,y,w,h} 原始座標；回傳已存的照片物件 */
async function processAndStore(k,src,sw,sh,crop){
  const d=DOCS.find(x=>x.k===k),cr=crop||{x:0,y:0,w:sw,h:sh};
  const L=d.aim==='card'?1600:2000,s=Math.min(1,L/Math.max(cr.w,cr.h));
  const c=document.createElement('canvas');c.width=Math.round(cr.w*s);c.height=Math.round(cr.h*s);
  c.getContext('2d').drawImage(src,cr.x,cr.y,cr.w,cr.h,0,0,c.width,c.height);
  const q=quality(c);watermark(c);   // 先檢查再加浮水印；原圖不保存
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));c.width=c.height=0;
  const p={id:S.cur.id+'-'+k+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),w:Math.round(cr.w*s),h:Math.round(cr.h*s),q};
  await dbPut('photos',{id:p.id,blob});photoURL(p.id,blob);
  S.cur.docs[k].push(p);await saveRec(S.cur);return p;
}

function sizeAim(){

  const s=Math.min(vf.width*.86/aw,vf.height*.74/ah);a.style.width=aw*s+'px';a.style.height=ah*s+'px';
}
function camLabel(){
  if(!cam)return;const {k,d}=cam,n=S.cur.docs[k].length;
  $('cT').textContent=k==='id'?(n===0?'身分證：請拍正面':'身分證：請拍反面'):d.n;

async function shoot(){
  if(!cam||!cam.stream)return;const {k,d}=cam,v=$('cV');
  if(S.cur.docs[k].length+cam.busy>=d.max)return;
  const VW=v.videoWidth,VH=v.videoHeight;if(!VW)return toast('相機尚未就緒');
  // 把瞄準框換算成影像座標（video 以 object-fit:cover 顯示），四周多留 6%
  const vr=v.getBoundingClientRect(),ar=$('cA').getBoundingClientRect(),sc=Math.max(vr.width/VW,vr.height/VH);
  const ox=(VW*sc-vr.width)/2,oy=(VH*sc-vr.height)/2,mx=ar.width*.06,my=ar.height*.06;
  let x0=(ar.left-vr.left-mx+ox)/sc,y0=(ar.top-vr.top-my+oy)/sc,w=(ar.width+2*mx)/sc,h=(ar.height+2*my)/sc;
  x0=Math.max(0,x0);y0=Math.max(0,y0);w=Math.min(VW-x0,w);h=Math.min(VH-y0,h);
  // 立即擷取畫面，背景處理
  const snap=document.createElement('canvas');snap.width=Math.round(w);snap.height=Math.round(h);snap.getContext('2d').drawImage(v,x0,y0,w,h,0,0,snap.width,snap.height);
  const f=$('cF');f.style.opacity=.7;setTimeout(()=>f.style.opacity=0,110);navigator.vibrate?.(30);
  cam.busy++;camLabel();
  try{
    const p=await processAndStore(k,snap,snap.width,snap.height);
    if(!p.q.ok)toast(p.q.bright<Q_DARK?'⚠ 太暗，建議移到亮處或開補光重拍':'⚠ 可能模糊，請點左下縮圖確認',2600);
    else if(k==='id'&&S.cur.docs.id.length===1)toast('正面完成，請翻到反面');
  }catch(e){toast('存檔失敗：'+e.message,4000)}
  finally{if(cam){cam.busy--;camLabel();if(S.cur.docs[k].length>=d.max&&!cam.busy){await sleep(500);closeCam();}}}
}
async function closeCam(){if(cam){while(cam&&cam.busy)await sleep(100);}closeOverlay();}
function stopCam(){if(!cam)return;cam.stream?.getTracks().forEach(t=>t.stop());cam.wake?.release?.();removeEventListener('resize',sizeAim);cam=null;render();}
function pickFiles(k){
  const d=DOCS.find(x=>x.k===k),inp=$('filePick');inp.value='';
  inp.onchange=async()=>{
    const fs=[...inp.files].slice(0,d.max-S.cur.docs[k].length);let bad=0;
    for(const f of fs){try{const bm=await loadImage(f);const p=await processAndStore(k,bm,bm.width,bm.height);if(!p.q.ok)bad++;bm.close?.();}catch(e){toast('無法讀取 '+f.name);}}
    render();if(bad)toast(`${bad} 張可能模糊或太暗`);
  };inp.click();
}
async function loadImage(f){
  if(window.createImageBitmap){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}}
  return await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f);});
}

/* ============ 同意書與簽名 ============ */
function openConsent(){
  const c=S.cur,text=S.pack?.consentText||'【範本】本人同意為辦理農產品驗證之目的，提供個人資料，僅供驗證使用。';
  const el=document.createElement('div');el.className='ov sign';
  el.innerHTML=`<div class="txt"><b>個資蒐集告知與同意</b><br>${esc(text)}<br><br>客戶：${esc(c.name)}（${esc(c.no)}）</div>
    <label class="chk" style="margin:4px 10px 8px"><input type="checkbox" id="gOk" ${c.consent.ok?'checked':''}>客戶已閱讀並同意</label>
    <div style="font-size:13px;color:var(--ink2);margin:0 12px 4px">請客戶在下方框內簽名（選填）</div>
    <canvas id="gC"></canvas>
    <div class="bt"><button class="btn warn" id="gClr">清除簽名</button><button class="btn sec" id="gX">取消</button><button class="btn" id="gSave">確定</button></div>`;
  openOverlay(el);
  const cv=$('gC'),r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=3;x.lineCap=x.lineJoin='round';x.strokeStyle='#111';
  let drawing=false,drawn=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{drawing=true;drawn=true;cv.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!drawing)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  if(c.consent.sigId)dbGet('photos',c.consent.sigId).then(p=>{if(p){createImageBitmap(p.blob).then(bm=>{x.drawImage(bm,0,0,r.width,r.height)})}});
  $('gClr').onclick=()=>{x.clearRect(0,0,cv.width,cv.height);drawn=false;if(c.consent.sigId){dbDel('photos',c.consent.sigId);delete c.consent.sigId;c.consent.signed=false;}};
  $('gX').onclick=closeOverlay;
  $('gSave').onclick=async()=>{
    const ok=$('gOk').checked;if(!ok){if(!confirm('客戶尚未勾選同意，仍要關閉？'))return;}
    c.consent.ok=ok;c.consent.time=ok?Date.now():null;
    if(drawn){const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const id=c.id+'-sig';await dbPut('photos',{id,blob});c.consent.sigId=id;c.consent.signed=true;c.consent.sigW=cv.width;c.consent.sigH=cv.height;}
    await saveRec(c);closeOverlay();
  };
}
async function consentPage(c){
  const W=1240,H=1754,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';const F=(s,b='')=>x.font=`${b} ${s}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  F(48,'bold');x.textAlign='center';x.fillText('個資蒐集告知與同意書',W/2,150);x.textAlign='left';F(32);
  const text=S.pack?.consentText||'';let y=260,line='';
  for(const ch of text){if(x.measureText(line+ch).width>W-200){x.fillText(line,100,y);y+=52;line=ch}else line+=ch}x.fillText(line,100,y);y+=100;
  [['客戶',c.name],['經營體編號',c.no+(c.temp?'（暫編，上傳時換號）':'')],['同意',c.consent.ok?'☑ 已閱讀並同意':'☐ 未勾選'],['勾選時間',c.consent.time?new Date(c.consent.time).toLocaleString('zh-TW',{hour12:false}):'—'],['收件同仁',c.staff],['批次碼',c.id]]
    .forEach(([a,b])=>{x.fillText(a,100,y);x.fillText(String(b),340,y);y+=58});
  y+=30;x.fillText('簽名',100,y);x.strokeStyle='#999';x.strokeRect(100,y+20,W-200,420);
  if(c.consent.sigId){const p=await dbGet('photos',c.consent.sigId);if(p){const bm=await loadImage(p.blob);const s=Math.min((W-220)/bm.width,400/bm.height);x.drawImage(bm,110,y+30,bm.width*s,bm.height*s);}}
  else{x.fillStyle='#999';x.fillText('（未簽名）',120,y+90);}
  watermark(cv);return cv;
}

/* ============ PDF ============ */
function makePdf(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  let n=2;const plan=pages.map(pg=>({pid:++n,cid:++n,ims:pg.map(()=>++n),pg}));
  const obj=(id,f)=>{offs[id]=len;push(id+' 0 obj\n');f();push('\nendobj\n')};
  push('%PDF-1.4\n%âã\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${plan.map(p=>p.pid+' 0 R').join(' ')}] /Count ${plan.length} >>`));
  plan.forEach(({pid,cid,ims,pg})=>{
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << ${ims.map((id,i)=>`/Im${i} ${id} 0 R`).join(' ')} >> >> /Contents ${cid} 0 R >>`));
    const cs=pg.map((im,i)=>`q ${im.dw.toFixed(2)} 0 0 ${im.dh.toFixed(2)} ${im.x.toFixed(2)} ${im.y.toFixed(2)} cm /Im${i} Do Q`).join('\n');
    obj(cid,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream')});
    pg.forEach((im,i)=>obj(ims[i],()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push('\nendstream')}));
  });
  const xr=len,tot=n+1;let s=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let i=1;i<tot;i++)s+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(s+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function fit(w,h,bx,by,bw,bh){const s=Math.min(bw/w,bh/h),dw=w*s,dh=h*s;return {x:bx+(bw-dw)/2,y:by+(bh-dh)/2,dw,dh}}
async function jpegOf(p){const r=await dbGet('photos',p.id);return {bytes:new Uint8Array(await r.blob.arrayBuffer()),w:p.w,h:p.h};}
async function buildPdfs(c){
  const M=30,W=595-2*M,H=842-2*M,out=[];
  for(const d of DOCS){
    const ph=c.docs[d.k];if(!ph.length)continue;let pages=[];
    if(d.k==='id'){const pg=[];for(let i=0;i<ph.length;i++){const im=await jpegOf(ph[i]);pg.push(Object.assign(im,fit(im.w,im.h,M,i===0?M+H/2+6:M,W,H/2-6)));}pages=[pg];}
    else for(const p of ph){const im=await jpegOf(p);pages.push([Object.assign(im,fit(im.w,im.h,M,M,W,H))]);}
    out.push({name:d.file,blob:makePdf(pages),pages:pages.length});
  }
  if(c.kind!=='sup'){const cv=await consentPage(c);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    out.push({name:'同意書.pdf',blob:makePdf([[Object.assign({bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height},fit(cv.width,cv.height,0,0,595,842))]]),pages:1});}
  return out;
}
async function sha256(b){const h=await crypto.subtle.digest('SHA-256',await b.arrayBuffer());return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}

/* ============ 完成本戶 ============ */
async function finish(){
  const c=S.cur,comp=completeness(c);
  if(!DOCS.some(d=>c.docs[d.k].length))return toast('還沒有拍任何文件');
  let msg='';if(comp.missing.length)msg+=`還缺：${comp.missing.join('、')}\n`;if(comp.bad)msg+=`有 ${comp.bad} 張可能模糊或太暗\n`;
  if(msg&&!confirm(msg+'\n仍要送出？缺的會列為「待補」，之後用「補件」補收。'))return;
  $('foot').innerHTML='<button class="btn" disabled>產生 PDF 中…</button>';
  try{
    const pdfs=await buildPdfs(c);c.files=[];
    for(const p of pdfs){const hash=await sha256(p.blob);await dbPut('pdfs',{id:c.id+'/'+p.name,blob:p.blob});c.files.push({name:p.name,hash,size:p.blob.size,pages:p.pages});}
    c.missing=comp.missing;c.status='queue';c.finished=Date.now();c.uploaded=[];c.tries=0;c.hold=S.set.mode===2;
    await saveRec(c);
  }catch(e){alert('產生 PDF 失敗：'+e.message);render();return;}
  S.view=c.id;S.cur=null;S.stack=['home'];S.screen='rec';history.replaceState({},'');render();
  if(S.set.mode===3)toast('模式 3：請按「匯出到手機」',3000);else pump(true);
}

/* ============ 上傳 ============ */
async function api(action,data,timeout=60000){
  if(!S.set.ep)throw new Error('未設定上傳位址');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(S.set.ep,{method:'POST',body:JSON.stringify(Object.assign({code:S.set.code,action},data)),signal:ctl.signal,redirect:'follow'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j.ok)throw new Error(j.err==='code'?'通行碼錯誤（請重新開啟設定連結）':j.err);return j;
  }catch(e){throw new Error(e.name==='AbortError'?'逾時':e.message);}finally{clearTimeout(t)}
}
function b64(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});}
let pumping=false,pumpTimer=null;
async function pump(force){
  if(pumping||S.set.mode===3||!S.set.ep)return;pumping=true;
  try{
    for(const r of S.recs.filter(x=>['queue','err'].includes(x.status))){
      if(!force&&r.next&&Date.now()<r.next)continue;
      if(!navigator.onLine){r.lastErr='離線';continue}
      r.status='up';refresh();
      try{
        for(const f of r.files){
          if(r.uploaded.includes(f.name))continue;
          const p=await dbGet('pdfs',r.id+'/'+f.name);if(!p)throw new Error('本機找不到 '+f.name);
          await api('put',{batch:r.id,file:f.name,hash:f.hash,b64:await b64(p.blob)},180000);
          r.uploaded.push(f.name);await saveRec(r);refresh();
        }
        const meta={no:r.no,temp:r.temp,name:r.name,kind:r.kind,staff:r.staff,notOwner:r.notOwner,files:r.files,missing:r.missing,consent:!!r.consent.ok,signed:!!r.consent.signed,hold:!!r.hold,finished:new Date(r.finished).toISOString(),ref:r.consent.ref||null,app:VER};
        const res=await api('commit',{batch:r.id,meta},60000);
        if(r.temp){r.tempNo=r.no;r.no=res.no;r.temp=false;S.recs.filter(x=>x.tempNo===undefined&&x.no===r.tempNo&&x.id!==r.id).forEach(x=>{x.tempNo=x.no;x.no=res.no;x.temp=false;saveRec(x)});toast(`暫編號 ${r.tempNo} 已換成正式編號 ${r.no}`,3500);}
        r.status='done';r.lastErr='';r.uploadedAt=Date.now();
      }catch(e){r.status='err';r.lastErr=e.message;r.tries=(r.tries||0)+1;r.next=Date.now()+Math.min(300e3,15e3*2**Math.min(5,r.tries-1));}
      await saveRec(r);refresh();
    }
    await poll();
  }finally{pumping=false;refresh();}
}
async function poll(){
  const ups=S.recs.filter(r=>r.status==='done'&&!r.hold);if(!ups.length||!navigator.onLine)return;
  try{const {done}=await api('status',{batches:ups.map(r=>r.id)},20000);
    for(const id of done){const r=S.recs.find(x=>x.id===id);r.status='nas';r.nasAt=Date.now();await purgeBlobs(r);await saveRec(r);}
  }catch(e){}
}
async function purgeBlobs(r,all){
  for(const d of DOCS)for(const p of r.docs[d.k]){await dbDel('photos',p.id);URL.revokeObjectURL(S.urls[p.id]);delete S.urls[p.id];}
  if(r.consent?.sigId)await dbDel('photos',r.consent.sigId);
  for(const f of r.files||[])await dbDel('pdfs',r.id+'/'+f.name);
}
function refresh(){if(!cam&&!overlayClose&&!['new','docs','settings'].includes(S.screen))render();else renderStrip();}
setInterval(()=>pump(false),30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pump(false)});

/* ============ 檢視／匯出 ============ */
async function openPdf(id,name){const p=await dbGet('pdfs',id+'/'+name);if(!p)return toast('這個檔案已從手機刪除（已入 NAS）');const u=URL.createObjectURL(p.blob);window.open(u,'_blank')||(location.href=u);setTimeout(()=>URL.revokeObjectURL(u),60000);}
async function exportRec(id){
  const r=S.recs.find(x=>x.id===id);
  for(const f of r.files){const p=await dbGet('pdfs',r.id+'/'+f.name);if(!p)continue;const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=`${r.no}-${r.name}_${f.name}`;document.body.appendChild(a);a.click();a.remove();await sleep(600);}
  if(r.status!=='done'){r.status='exp';await saveRec(r);}render();toast('已下載。轉入電腦後請刪除手機上的檔案',3500);
}

/* ============ 設定 ============ */
async function setMode(v){S.set.mode=v;await saveSet();render();}
async function loadPack(){try{toast('下載中…',1500);const r=await api('pack',{},60000);await setPack(r.pack);}catch(e){alert('下載收件包失敗：'+e.message)}}
async function setPack(p){if(!p||!Array.isArray(p.customers))throw new Error('格式不對');S.pack=p;await dbPut('kv',p,'pack');toast(`收件包已載入：${p.customers.length} 戶`);render();}
$('packPick').onchange=async e=>{try{await setPack(JSON.parse(await e.target.files[0].text()))}catch(err){alert('匯入失敗：'+err.message)}};
async function testConn(){try{const r=await api('ping',{},15000);toast('連線正常（中繼時間 '+r.time+'）')}catch(e){alert('連線失敗：'+e.message)}}
async function clearDone(){const ds=S.recs.filter(r=>r.status==='nas');if(!ds.length)return toast('沒有已入 NAS 的紀錄');if(!confirm(`清除 ${ds.length} 筆已入 NAS 的紀錄？`))return;for(const r of ds)await dbDel('recs',r.id);S.recs=S.recs.filter(r=>r.status!=='nas');render();}
async function wipeAll(){
  const p=S.recs.filter(r=>PENDING.includes(r.status)).length;
  if(!confirm(p?`⚠ 有 ${p} 戶尚未上傳或未完成，清除後無法復原。確定清除全部？`:'清除本機全部收件資料？'))return;
  if(p&&!confirm('再確認一次：未上傳的資料會永久刪除。'))return;
  for(const st of ['recs','photos','pdfs'])await tx(st,'readwrite',s=>s.clear());S.recs=[];S.cur=null;toast('已清除');render();
}

async function applySetup(){
  if(!location.hash.startsWith('#setup'))return;
  const q=new URLSearchParams(location.hash.slice(7));
  if(q.get('ep')&&q.get('code')){S.set.ep=q.get('ep');S.set.code=q.get('code');await saveSet();toast('連線設定完成',2500);}
  history.replaceState({},'',location.pathname+location.search);  // 把通行碼從網址列移除
  if(S.set.ep&&!S.pack&&navigator.onLine)loadPack();
}

/* ============ 啟動 ============ */
(async()=>{
  await openDB();
  S.set=Object.assign(S.set,(await dbGet('kv','set'))||{});
  S.pack=(await dbGet('kv','pack'))||null;
  S.recs=await dbAll('recs');
  await applySetup();addEventListener('hashchange',async()=>{await applySetup();render();});
  for(const r of S.recs)if(r.status==='up'){r.status='queue';await saveRec(r);}   // 上次上傳到一半被關掉
  history.replaceState({},'');render();
  navigator.storage?.persist?.();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
  pump(true);
})().catch(e=>{document.body.innerHTML='<p style="padding:20px">啟動失敗：'+esc(e.message)+'<br>（無痕模式或停用網站資料時無法使用）</p>'});
</script>
